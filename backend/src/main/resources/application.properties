# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── SQLite DataSource ─────────────────────────────────────────────────────────
# Path is relative to the working directory (run from backend/)
spring.datasource.url=jdbc:sqlite:clinic.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Preserve exact Java camelCase field names as DB column names
# (matches the schema created by the original Node.js backend)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ── Misc ──────────────────────────────────────────────────────────────────────
spring.sql.init.mode=never
logging.level.com.clinic=INFO
logging.level.root=WARN
logging.level.org.springframework.web=INFO
