# Server
server.port=8080

# ── PostgreSQL DataSource ───────────────────────────────────────────────────
# Set these via environment variables or replace directly
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinic_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' keeps existing tables and adds new ones (Stock Management tables
#  will be auto-created on first startup)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Preserve exact Java camelCase field names as DB column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ── Misc ─────────────────────────────────────────────────────────────────────
spring.sql.init.mode=never
logging.level.com.clinic=INFO
logging.level.root=WARN
logging.level.org.springframework.web=INFO
spring.jackson.deserialization.fail-on-unknown-properties=false
